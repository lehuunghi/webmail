name: QR sign-in checks
on:
  push:
    branches: [main, qr-login-webmail]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run i18n:check
      - run: npm run build
      - run: npm install --prefix .ui-tools --no-save --package-lock=false playwright
      - run: node scripts/qr-login-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qr-login-ui
          path: ui-smoke
          if-no-files-found: warn
